<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explore Classic World maps, NPCs, monsters and recorded portal routes. Track your MapleStory quest progress with Maple Atlas.">
  <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1f20" media="(prefers-color-scheme: dark)">
  <title>Maple Atlas</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap');
    #maple-atlas-concept { --mc-ink:light-dark(#213831,#e1eae5); --mc-muted:light-dark(#627269,#acbdb2); --mc-paper:light-dark(#fffefa,#202e29); --mc-soft:light-dark(#f4f5ef,#293b32); --mc-edge:light-dark(#dce3da,#405247); --mc-blue:light-dark(#2564de,#83acff); --mc-orange:light-dark(#a44c20,#ffb889); --mc-water:light-dark(#d7e9e9,#213e43); --mc-land:light-dark(#e2e7c5,#4b6047); --mc-forest:light-dark(#bad2a8,#375444); --mc-sand:light-dark(#e6d9b3,#7b7051); --mc-road:light-dark(#fff4cc,#b5a77c); --mc-shadow:light-dark(#1935291a,#00000038); font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--mc-ink); color-scheme:light dark; }
    #maple-atlas-concept { --mc-ink:light-dark(#1f1f1f,#e3e3e3); --mc-muted:light-dark(#444746,#c4c7c5); --mc-paper:light-dark(#f8fafd,#1e1f20); --mc-soft:light-dark(#edf2fa,#282a2c); --mc-edge:light-dark(#c4c7c5,#444746); --mc-blue:light-dark(#0b57d0,#a8c7fa); font-family:'Roboto',Arial,sans-serif; }
    #maple-atlas-concept * { box-sizing:border-box; }
    #maple-atlas-concept button,#maple-atlas-concept input,#maple-atlas-concept select { font:inherit; color:inherit; }
    #maple-atlas-concept button { border:1px solid var(--mc-edge); background:var(--mc-paper); border-radius:20px; min-height:40px; padding:8px 14px; font-weight:500; }
    #maple-atlas-concept button:disabled { opacity:.45; }
    #maple-atlas-concept button:hover:not(:disabled) { background:var(--mc-soft); }
    #maple-atlas-concept .mc-shell { background:var(--mc-paper); overflow:hidden; position:relative; }
    #maple-atlas-concept .mc-header { min-height:58px; display:flex; align-items:center; gap:10px; padding:12px 112px 12px 18px; border-bottom:1px solid var(--mc-edge); flex-wrap:wrap; }
    #maple-atlas-concept .mc-logo { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:650; letter-spacing:-.6px; }
    #maple-atlas-concept .mc-logo i { color:var(--mc-orange); }
    #maple-atlas-concept .mc-header small { font-size:11px; color:var(--mc-muted); }
    #maple-atlas-concept .mc-profile { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:12px; }
    #maple-atlas-concept .mc-profile input { width:48px; padding:5px; border:1px solid var(--mc-edge); background:var(--mc-soft); border-radius:6px; }
    #maple-atlas-concept .mc-workspace { position:relative; min-height:670px; }
    #maple-atlas-concept .mc-panel { position:absolute; top:16px; left:16px; width:276px; max-height:calc(100% - 64px); overflow:auto; background:var(--mc-paper); z-index:3; padding:16px; border:1px solid var(--mc-edge); border-radius:16px; box-shadow:0 5px 24px var(--mc-shadow); }
    #maple-atlas-concept .mc-routeform { display:grid; gap:8px; }
    #maple-atlas-concept .mc-field { display:flex; align-items:center; gap:8px; border:0; background:var(--mc-soft); border-radius:28px; padding:12px; }
    #maple-atlas-concept .mc-letter { flex-shrink:0; display:grid; place-items:center; height:22px; width:22px; font-size:11px; font-weight:650; border:1px solid var(--mc-blue); color:var(--mc-blue); border-radius:50%; }
    #maple-atlas-concept .mc-field input { background:transparent; border:0; min-width:0; width:100%; padding:0; outline-offset:5px; }
    #maple-atlas-concept .mc-formactions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%; }
    #maple-atlas-concept .mc-formactions button { width:100%; min-width:0; min-height:48px; border-radius:24px; font-size:12px; white-space:normal; padding:8px; }
    #maple-atlas-concept .mc-status { color:var(--mc-muted); font-size:11px; margin:8px 0 15px; min-height:30px; }
    #maple-atlas-concept .mc-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%; border-bottom:1px solid var(--mc-edge); margin-bottom:16px; }
    #maple-atlas-concept .mc-tabs button { width:100%; min-width:0; min-height:48px; padding:8px 2px; border:0; border-radius:0; background:transparent; font-size:12px; color:var(--mc-muted); }
    #maple-atlas-concept .mc-tabs button[aria-pressed=true] { color:var(--mc-blue); box-shadow:0 2px var(--mc-blue); }
    #maple-atlas-concept .mc-detail h3 { font-size:24px; line-height:1.15; margin:0 0 4px; letter-spacing:-.8px; font-weight:650; }
    #maple-atlas-concept .mc-eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--mc-muted); margin-bottom:6px; }
    #maple-atlas-concept .mc-secondary { color:var(--mc-muted); font-size:12px; }
    #maple-atlas-concept .mc-placeactions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%; margin:15px 0; }
    #maple-atlas-concept .mc-placeactions button { width:100%; min-width:0; min-height:48px; border-radius:24px; padding:8px; font-size:12px; }
    #maple-atlas-concept button.mc-primary { background:var(--mc-blue); color:light-dark(#ffffff,#10264b); border-color:transparent; }
    #maple-atlas-concept button.mc-primary:hover { filter:brightness(.95); background:var(--mc-blue); }
    #maple-atlas-concept .mc-category { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; width:100%; margin-bottom:12px; }
    #maple-atlas-concept .mc-category button { width:100%; min-width:0; font-size:11px; min-height:48px; border-radius:24px; padding:8px 3px; }
    #maple-atlas-concept .mc-category button[aria-pressed=true] { background:var(--mc-soft); border-color:var(--mc-ink); }
    #maple-atlas-concept .mc-row { padding:11px 0; border-bottom:1px solid var(--mc-edge); display:flex; gap:9px; align-items:flex-start; }
    #maple-atlas-concept .mc-row strong { display:block; font-weight:600; font-size:13px; }
    #maple-atlas-concept .mc-row small { display:block; color:var(--mc-muted); font-size:11px; margin-top:3px; }
    #maple-atlas-concept .mc-row button { margin-left:auto; min-height:30px; padding:5px 7px; font-size:11px; flex-shrink:0; }
    #maple-atlas-concept .mc-row .mc-symbol { height:28px; width:28px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; background:var(--mc-soft); color:var(--mc-orange); }
    #maple-atlas-concept .mc-map { position:absolute; inset:0; min-width:0; height:100%; background:var(--mc-water); overflow:hidden; touch-action:none; }
    #maple-atlas-concept .mc-map svg.mc-atlas { display:block; width:100%; height:100%; }
    #maple-atlas-concept .mc-maptools { position:absolute; top:16px; left:308px; display:flex; gap:6px; flex-wrap:wrap; max-width:calc(100% - 328px); z-index:2; }
    #maple-atlas-concept .mc-maptools button { box-shadow:0 3px 14px var(--mc-shadow); font-size:12px; border:0; }
    #maple-atlas-concept .mc-maptools button[aria-pressed=true] { background:light-dark(#d3e3fd,#0842a0); color:light-dark(#041e49,#d3e3fd); }
    #maple-atlas-concept .mc-place { position:absolute; transform:translate(-50%,-20px); display:flex; flex-direction:column; align-items:center; background:transparent; border:0; padding:8px; border-radius:8px; min-width:44px; max-width:150px; box-shadow:none; white-space:nowrap; }
    #maple-atlas-concept .mc-place:hover { background:transparent !important; }
    #maple-atlas-concept .mc-place .mc-dot { height:13px; width:13px; border:3px solid var(--mc-paper); border-radius:50%; background:var(--mc-ink); box-shadow:0 0 0 1px var(--mc-ink); margin-bottom:5px; }
    #maple-atlas-concept .mc-place .mc-tag { font-size:12px; font-weight:600; background:var(--mc-paper); padding:3px 7px; border-radius:6px; box-shadow:0 2px 8px var(--mc-shadow); }
    #maple-atlas-concept .mc-place[data-selected=true] .mc-tag { color:light-dark(#fff,#10264b); background:var(--mc-blue); }
    #maple-atlas-concept .mc-place[data-endpoint=true] .mc-dot { width:24px; height:24px; background:var(--mc-blue); color:light-dark(#fff,#10264b); display:grid; place-items:center; font-size:10px; border-width:2px; }
    #maple-atlas-concept .mc-place .mc-badge { position:absolute; top:0; right:0; font-size:10px; background:var(--mc-orange); color:light-dark(#fff,#2c1d12); padding:1px 5px; border-radius:9px; }
    #maple-atlas-concept .mc-zooms { position:absolute; right:14px; bottom:55px; display:grid; gap:5px; z-index:2; }
    #maple-atlas-concept .mc-zooms button { width:38px; height:38px; display:grid; place-items:center; box-shadow:0 3px 14px var(--mc-shadow); padding:5px; }
    #maple-atlas-concept .mc-mapfooter { position:absolute; bottom:0; left:0; right:0; padding:10px 14px; display:flex; gap:10px; justify-content:space-between; font-size:11px; background:var(--mc-paper); color:var(--mc-muted); }
    #maple-atlas-concept .mc-mapcaption { position:absolute; bottom:48px; left:308px; background:var(--mc-paper); padding:9px 12px; border-radius:10px; font-size:12px; box-shadow:0 3px 14px var(--mc-shadow); max-width:calc(100% - 380px); }
    #maple-atlas-concept .mc-steplist { list-style:none; margin:12px 0; padding:0; }
    #maple-atlas-concept .mc-steplist li { border-left:2px solid var(--mc-blue); padding:8px 0 8px 13px; font-size:13px; }
    #maple-atlas-concept .mc-steplist li small { display:block; color:var(--mc-muted); font-size:11px; }
    #maple-atlas-concept .mc-bottom { border-top:1px solid var(--mc-edge); padding:8px 16px; font-size:11px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; color:var(--mc-muted); }
    #maple-atlas-concept .mc-empty { padding:18px 0; color:var(--mc-muted); }
    #maple-atlas-concept .mc-screenreader { position:absolute; width:1px;height:1px;overflow:hidden;clip-path:inset(50%); }
    #maple-atlas-concept .mc-panel {width:296px;border-radius:24px;}
    #maple-atlas-concept .mc-maptools {left:328px;max-width:calc(100% - 348px);}
    #maple-atlas-concept .mc-mapcaption {left:328px;max-width:calc(100% - 390px);}
    #maple-atlas-concept .mc-place {width:44px;height:44px;min-width:44px;max-width:44px;min-height:44px;padding:0;border-radius:50%;transform:translate(-50%,-50%);display:block;z-index:1;}
    #maple-atlas-concept .mc-place .mc-tag {position:absolute;left:22px;top:42px;display:none;width:max-content;max-width:240px;line-height:16px;white-space:normal;overflow:visible;text-overflow:clip;pointer-events:none;}
    #maple-atlas-concept .mc-place.mc-showlabel .mc-tag {display:block;}
    #maple-atlas-concept .mc-place .mc-dot {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:14px;width:14px;border:2px solid var(--mc-paper);margin:0;background:light-dark(#d7ab42,#e4c071);box-shadow:0 0 0 1px light-dark(#8e773e,#5d4b23);font-size:10px;}
    #maple-atlas-concept .mc-place[data-route=true] .mc-dot {width:22px;height:22px;background:var(--mc-blue);color:light-dark(#fff,#10264b);display:grid;place-items:center;box-shadow:0 0 0 1px var(--mc-blue);}
    #maple-atlas-concept .mc-place[data-selected=true] {z-index:2;}
    #maple-atlas-concept .mc-place[data-selected=true] .mc-dot {box-shadow:0 0 0 4px light-dark(#d3e3fd,#0842a0);}
    #maple-atlas-concept .mc-quest {padding:12px 0;border-bottom:1px solid var(--mc-edge);}
    #maple-atlas-concept .mc-quest strong {display:block;font-size:14px;font-weight:500;}
    #maple-atlas-concept .mc-quest small {display:block;font-size:12px;color:var(--mc-muted);margin-top:4px;}
    #maple-atlas-concept .mc-quest select {margin-top:8px;min-height:38px;padding:7px 9px;border:1px solid var(--mc-edge);border-radius:10px;background:var(--mc-soft);max-width:100%;}
    #maple-atlas-concept .mc-datahint {font-size:12px;color:var(--mc-muted);padding:12px 0;}
    #maple-atlas-concept .mc-source {display:block;margin-top:12px;font-size:11px;color:var(--mc-blue);}
    #maple-atlas-concept .mc-sprite {display:grid;place-items:center;width:48px;height:50px;flex:0 0 48px;}
    #maple-atlas-concept .mc-sprite img {display:block;max-width:48px;max-height:50px;object-fit:contain;image-rendering:pixelated;}
    #maple-atlas-concept .mc-expand {margin-top:15px;width:100%;}
    #maple-atlas-concept .mc-steplist li {padding:5px 0 8px 8px;}
    #maple-atlas-concept .mc-steplist button {background:transparent;border:0;border-radius:8px;padding:5px;text-align:left;min-height:30px;font-size:12px;width:100%;}
    @media(max-width:700px) { #maple-atlas-concept .mc-workspace {min-height:930px;} #maple-atlas-concept .mc-panel{display:contents;} #maple-atlas-concept .mc-routeform {position:absolute;z-index:3;top:12px;left:12px;right:12px;padding:10px;background:var(--mc-paper);border-radius:14px;box-shadow:0 4px 20px var(--mc-shadow);} #maple-atlas-concept .mc-status {display:none;} #maple-atlas-concept .mc-tabs {position:absolute;z-index:4;top:540px;left:12px;right:12px;padding:15px 16px 8px;margin:0;background:var(--mc-paper);border-radius:18px 18px 0 0;} #maple-atlas-concept .mc-detail{position:absolute;z-index:3;top:596px;left:12px;right:12px;bottom:40px;overflow:auto;padding:12px 16px;background:var(--mc-paper);border-radius:0 0 16px 16px;} #maple-atlas-concept .mc-maptools {top:190px;left:12px;max-width:calc(100% - 24px);} #maple-atlas-concept .mc-mapcaption{display:none;} #maple-atlas-concept .mc-zooms{top:252px;bottom:auto;} #maple-atlas-concept .mc-profile{display:none;} #maple-atlas-concept .mc-field input{font-size:16px;} }
    @media(max-width:700px) {#maple-atlas-concept .mc-tabs {width:auto;} }
    @media(pointer:coarse) {#maple-atlas-concept button {min-height:48px;} #maple-atlas-concept .mc-zooms button {width:48px;height:48px;} }

    #maple-atlas-concept .mc-route-summary {font-size:11px;color:var(--mc-muted);padding:4px 2px 0;overflow-wrap:anywhere;}
    #maple-atlas-concept .mc-quest-heading {display:flex;gap:10px;align-items:center;}
    #maple-atlas-concept .mc-quest-heading>div {min-width:0;}
    #maple-atlas-concept .mc-quest-objectives,#maple-atlas-concept .mc-quest-rewards {margin-top:10px;}
    #maple-atlas-concept .mc-quest-item {display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;min-width:0;}
    #maple-atlas-concept .mc-quest-item .mc-sprite {width:32px;height:36px;flex-basis:32px;}
    #maple-atlas-concept .mc-quest-item .mc-sprite img {max-width:32px;max-height:36px;}
    #maple-atlas-concept .mc-row>div {min-width:0;overflow-wrap:anywhere;}
    #maple-atlas-concept .mc-nearby button {margin:7px 0 0;min-height:40px;padding:8px 12px;}
    #maple-atlas-concept .mc-place[data-schematic=true]:not([data-route=true]) .mc-dot {border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);}
    #maple-atlas-concept .mc-quest select {min-height:44px;}
    @media(max-width:700px) {
      #maple-atlas-concept .mc-header {padding:10px 12px;flex-wrap:nowrap;}
      #maple-atlas-concept .mc-header .mc-profile {display:flex;font-size:11px;}
      #maple-atlas-concept .mc-header small {display:none;}
      #maple-atlas-concept .mc-maptools {top:232px;}
      #maple-atlas-concept .mc-zooms {top:282px;}
    }


    #maple-atlas-concept .mc-sheet-toggle {display:none;}
    @media(max-width:700px) {
      #maple-atlas-concept .mc-sheet-toggle {display:block;margin-left:auto;font-size:12px;min-height:40px;padding:6px 12px;}
      #maple-atlas-concept .mc-profile {margin-left:0;}
      #maple-atlas-concept .mc-header {gap:6px;}
      #maple-atlas-concept .mc-logo {font-size:16px;}
      #maple-atlas-concept:not(.mc-sheet-open) .mc-detail {display:none;}
      #maple-atlas-concept:not(.mc-sheet-open) .mc-tabs {top:auto;bottom:12px;border-radius:18px;border-bottom:0;}
      #maple-atlas-concept .mc-field {padding:9px 10px;}
      #maple-atlas-concept .mc-routeform {gap:6px;}
      #maple-atlas-concept .mc-maptools {top:212px;}
      #maple-atlas-concept .mc-zooms {top:262px;}
    }

    @media(max-width:700px) {
      #maple-atlas-concept .mc-tabs {height:56px;padding:4px 12px;}
      #maple-atlas-concept .mc-mapfooter {display:none;}
    }

    #maple-atlas-concept {--mc-control-gap:8px;--mc-action-space:12px;--mc-section-space:16px;}
    #maple-atlas-concept .mc-routeform {gap:var(--mc-control-gap);}
    #maple-atlas-concept .mc-formactions {gap:var(--mc-control-gap);margin-block:4px;}
    #maple-atlas-concept .mc-route-summary {padding:0 2px;}
    #maple-atlas-concept .mc-status {margin:var(--mc-action-space) 0 var(--mc-section-space);}
    #maple-atlas-concept .mc-placeactions {gap:var(--mc-control-gap);margin-block:var(--mc-section-space);}
    #maple-atlas-concept .mc-category {gap:var(--mc-control-gap);margin-bottom:var(--mc-section-space);}
    #maple-atlas-concept .mc-tabs {gap:var(--mc-control-gap);}
    @media(max-width:700px) {
      #maple-atlas-concept .mc-routeform {padding:12px;}
    }

html,body { margin:0 !important; padding:0 !important; height:100%; overflow:hidden; }
#maple-atlas-concept .mc-shell { height:100dvh; display:flex; flex-direction:column; }
#maple-atlas-concept .mc-header { flex:0 0 58px; }
#maple-atlas-concept .mc-workspace { flex:1 1 auto; min-height:0; }
#maple-atlas-concept .mc-bottom { flex:0 0 26px; font-size:11px; padding:5px 14px; }
@media(max-width:700px) {
  #maple-atlas-concept .mc-header { padding-right:15px; }
  #maple-atlas-concept .mc-bottom { display:none; }

  #maple-atlas-concept .mc-detail { top:auto; bottom:12px; height:268px; }

}
@media(max-width:700px) and (max-height:700px) {
  #maple-atlas-concept .mc-tabs { bottom:185px; }
  #maple-atlas-concept .mc-detail { height:173px; }
  #maple-atlas-concept .mc-maptools { top:212px; }
  #maple-atlas-concept .mc-zooms { top:262px; }
}

@media(max-width:700px) and (max-height:700px) {
  #maple-atlas-concept.mc-sheet-open .mc-detail {height:calc(100% - 56px);bottom:0;border-radius:0;}
  #maple-atlas-concept.mc-sheet-open .mc-tabs {top:0;bottom:auto;border-radius:0;}
}

.cursor-interaction{cursor:pointer}
  </style>
</head>
<body>
<div id="maple-atlas-concept">

  <div class="mc-shell">
    <div class="mc-header"><div class="mc-logo"><i data-lucide="map" aria-hidden="true"></i>Maple Atlas</div><small>Classic World</small><button type="button" id="mc-sheet-toggle" class="mc-sheet-toggle cursor-interaction" aria-expanded="false">Details</button><label class="mc-profile">Level <input id="mc-level" aria-label="Character level" type="number" min="1" max="100" value="18"></label></div>
    <div class="mc-workspace">
      <aside class="mc-panel">
        <form class="mc-routeform" id="mc-form">
          <label class="mc-field"><span class="mc-letter">A</span><input id="mc-from" aria-label="Starting place" list="mc-towns" value="Lith Harbor" placeholder="Your current map"></label>
          <label class="mc-field"><span class="mc-letter">B</span><input id="mc-to" aria-label="Destination" list="mc-towns" value="Henesys" placeholder="Where to?"></label>
          <datalist id="mc-towns"><option>Lith Harbor</option><option>Henesys</option><option>Kerning City</option><option>Ellinia</option><option>Perion</option><option>Sleepywood</option><option>Florina Beach</option></datalist>
          <div class="mc-formactions"><button type="button" id="mc-pickstart" class="cursor-interaction">Pick start on map</button><button type="submit" class="mc-primary cursor-interaction">Show route</button></div>
          <div class="mc-route-summary" id="mc-caption" aria-live="polite">Select any numbered stop</div>
        </form>
        <div class="mc-status" id="mc-status" aria-live="polite">Location set manually · Change either field or select a place.</div>
        <div class="mc-tabs" aria-label="Map panel"><button type="button" data-panel="place" aria-pressed="true" class="cursor-interaction">What's here?</button><button type="button" data-panel="route" aria-pressed="false" class="cursor-interaction">Directions</button><button type="button" data-panel="progress" aria-pressed="false" class="cursor-interaction">Progress</button></div>
        <div class="mc-detail" id="mc-detail" aria-live="polite"></div>
      </aside>
      <div class="mc-map" id="mc-map" aria-label="Interactive concept atlas of Victoria Island">
        <svg class="mc-atlas" id="mc-svg" role="img" aria-label="Original vector illustration of Victoria Island with actual map nodes and recorded portal connections"><g id="mc-world">
<g id="mc-world-art" xmlns="http://www.w3.org/2000/svg" aria-label="Original illustrated Victoria Island landscape" role="img">

<script>
(() => {
  const store = 'character';
  const record = 'current';
  const oldKey = 'maple-atlas-progress-v1';
  const status = message => {
    for (const id of ['mc-save-status', 'mc-journal-storage']) {
      const el = document.getElementById(id);
      if (el) el.textContent = message;
    }
  };
  const app = document.getElementById('maple-atlas-concept');
  app.inert = true;
  status('Opening local progress…');
  let database;
  let writeQueue = Promise.resolve();
  const open = new Promise((resolve, reject) => {
    const request = indexedDB.open('maple-atlas', 1);
    request.onupgradeneeded = () => request.result.createObjectStore(store);
    request.onsuccess = () => {
      database = request.result;
      database.onversionchange = () => {
        database.close();
        status('Reload to continue saving progress.');
      };
      resolve(database);
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => status('Close other Maple Atlas tabs to open progress.');
  });
  const transaction = (mode, operation) => open.then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const request = operation(tx.objectStore(store));
    tx.oncomplete = () => resolve(request.result);
    tx.onabort = () => reject(tx.error || new Error('Local save was interrupted.'));
    tx.onerror = () => reject(tx.error);
  }));
  window.openai = {
    widgetState: null,
    setWidgetState(next) {
      const snapshot = structuredClone(next);
      this.widgetState = snapshot;
      status('Saving on this device…');
      writeQueue = writeQueue.catch(() => {}).then(() => transaction('readwrite', db => db.put(snapshot, record)));
      return writeQueue.then(() => status('Saved on this device')).catch(error => {
        status('Not saved · Browser storage unavailable');
        throw error;
      });
    }
  };
  window.mapleStorageReady = transaction('readonly', db => db.get(record)).then(async saved => {
    if (!saved) {
      try { saved = JSON.parse(localStorage.getItem(oldKey) || 'null'); } catch (_) {}
      if (saved?.modelContent?.preview === 'maple-atlas-data-v2') {
        await transaction('readwrite', db => db.put(saved, record));
        try { localStorage.removeItem(oldKey); } catch (_) {}
      }
    }
    window.openai.widgetState = saved || null;
    status('Progress saved on this device');
  }).catch(() => {
    status('Browser storage unavailable · Progress will not persist');
  }).finally(() => { app.inert = false; });
})();

</script>

    const status=state.status[q.id]||'not-started';const reward=[q.exp?q.exp.toLocaleString()+' EXP':'',q.mesos?q.mesos.toLocaleString()+' mesos':''].filter(Boolean).join(' · ');
    const objectives=q.objectives.map(o=>'<div class="mc-quest-item">'+(['mob','item'].includes(o.type)?sprite(o.type==='mob'?'monster':'item',o):'')+'<span>'+esc(o.name)+' × '+o.count+'</span></div>').join('');
    const rewards=(q.items||[]).map(o=>'<div class="mc-quest-item">'+sprite('item',o)+'<span>'+esc(o.name)+' × '+o.count+(o.guaranteed?'':' <small>Possible reward</small>')+'</span></div>').join('');
    return '<div class="mc-quest"><div class="mc-quest-heading">'+(q.npcId?sprite('npc',{id:q.npcId,name:q.npc}):'')+'<div><strong>'+esc(q.name)+'</strong><small>'+esc(q.npc||'Quest record')+' · Lv. '+q.level+'+</small></div></div><small>'+esc(q.here||'Quest journal')+' · '+(q.level>state.level?'Below level requirement':'Check remaining requirements')+'</small>'+(objectives?'<div class="mc-quest-objectives">'+objectives+'</div>':'')+((reward||rewards)?'<div class="mc-quest-rewards"><small>Rewards'+(reward?' · '+reward:'')+'</small>'+rewards+'</div>':'')+'<select aria-label="Progress for '+esc(q.name)+'" data-quest="'+q.id+'">'+[['not-started','Not started'],['in-progress','In progress'],['completed','Completed'],['skipped','Skipped']].map(([v,n])=>'<option value="'+v+'" '+(status===v?'selected':'')+'>'+n+'</option>').join('')+'</select></div>';
  }).join('')||'<div class="mc-empty">No matching quest records in this export.</div>';}
  function nearbyNPCs(start){
    const queue=[{id:String(start),hops:0}],seen=new Set([String(start)]),found=[];
    while(queue.length&&found.length<6){const current=queue.shift(),m=get(current.id);if(!m)continue;
      if(current.hops&&m.npcs.length)for(const npc of m.npcs.slice(0,3))found.push({npc,map:m,hops:current.hops});
      if(current.hops>=6)continue;
      for(const e of m.portals){const id=String(e.to);if(!seen.has(id)&&get(id)){seen.add(id);queue.push({id,hops:current.hops+1});}}
    }
    return found.slice(0,6);
  }
  function setSheet(open){root.classList.toggle('mc-sheet-open',open);$('#mc-sheet-toggle').textContent=open?'Map':'Details';$('#mc-sheet-toggle').setAttribute('aria-expanded',String(open));}
  $('#mc-sheet-toggle').onclick=()=>{setSheet(!root.classList.contains('mc-sheet-open'));camera();};
  function detail(){
    $$('.mc-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===state.panel)));
    const m=get(state.selected),box=$('#mc-detail');if(!m)return;
    if(state.panel==='route'){
      const n=state.route.length-1;
      box.innerHTML='<div class="mc-eyebrow">Recorded portal route</div><h3>'+esc(get(state.to).name)+'</h3><div class="mc-secondary">'+(n<0?'No documented walk found':n+' transitions · Fewest recorded portals')+'</div>'+(n>=0?'<ol class="mc-steplist">'+state.route.map((id,i)=>{const p=get(id),edge=p.portals.find(e=>String(e.to)===state.route[i+1]);return '<li><button type="button" data-inspect="'+id+'" class="cursor-interaction">'+i+'. '+esc(p.name)+'</button><small>'+(edge?'Exit '+esc(edge.name)+' → '+esc(edge.arrival||'next map'):i===n?'Destination':'')+'</small></li>';}).join('')+'</ol><button type="button" class="mc-primary cursor-interaction" id="mc-step">'+(state.step>=n?'Restart route':'I reached the next map')+'</button><div class="mc-secondary" style="margin-top:10px">Manual position · '+esc(get(state.route[state.step]).name)+'</div>':'<div class="mc-empty">Try a different start. Some scripted destinations are not included in this snapshot.</div>');
      if($('#mc-step'))$('#mc-step').onclick=()=>{state.step=state.step>=n?0:state.step+1;state.selected=state.route[state.step];render();save();};
    }else if(state.panel==='progress'){
      const tracked=DATA.quests.filter(q=>state.status[q.id]);
      box.innerHTML='<div class="mc-eyebrow">Your character</div><h3>Quest journal</h3><div class="mc-secondary">'+Object.values(state.status).filter(x=>x==='completed').length+' completed · Manually tracked</div><div id="mc-journal-storage" class="mc-datahint" role="status">'+esc($('#mc-save-status').textContent)+'</div>'+questRows(tracked.length?tracked:DATA.quests.filter(q=>q.npc==='Olaf'));
    }else{
      const a=anchor(m.id),members=a?a.members.map(get).filter(Boolean):[];
      const categories=[['monsters','Monsters'],['npcs','NPCs'],['quests','Quests'],['connections','Places']];
      box.innerHTML='<div class="mc-eyebrow">'+esc(m.street)+' · '+(m.town?'Town':'Field')+'</div><h3>'+esc(m.name)+'</h3><div class="mc-secondary">'+m.npcs.length+' NPCs · '+m.monsters.length+' monster types · '+m.portals.length+' recorded exits</div><div class="mc-placeactions"><button type="button" id="mc-go" class="mc-primary cursor-interaction">Directions</button><button type="button" id="mc-start" class="cursor-interaction">Start here</button></div>'+(!a?'<div class="mc-datahint">Atlas position not reviewed. Use the connections below.</div>':a.schematic?'<div class="mc-datahint">◇ Schematic position · Portal connections are recorded; this point is placed to explain the forest path.</div>':'')+'<div class="mc-category">'+categories.map(([c,n])=>'<button type="button" class="cursor-interaction" data-category="'+c+'" aria-pressed="'+(c===state.category)+'">'+n+'</button>').join('')+'</div><div id="mc-items"></div>';
      const items=$('#mc-items');
      if(state.category==='monsters')items.innerHTML=m.monsters.length?m.monsters.map(mon=>'<div class="mc-row">'+sprite('monster',mon)+'<div><strong>'+esc(mon.name)+'</strong><small>Level '+mon.level+' · '+mon.exp+' EXP</small><small>'+mon.spawns+' recorded spawn points</small></div></div>').join('')+'<div class="mc-datahint">Spawn points are map data, not live monsters.</div>':'<div class="mc-empty">No monster placements recorded in this map.</div>';
      if(state.category==='npcs')items.innerHTML=m.npcs.length?m.npcs.map(n=>'<div class="mc-row">'+sprite('npc',n)+'<div><strong>'+esc(n.name)+'</strong><small>'+DATA.quests.filter(q=>q.npc===n.name).length+' quest associations</small></div></div>').join(''):'<div class="mc-datahint">No NPCs recorded in '+esc(m.name)+'. Find these NPCs nearby:</div>'+nearbyNPCs(m.id).map(({npc,map,hops})=>'<div class="mc-row mc-nearby">'+sprite('npc',npc)+'<div><strong>'+esc(npc.name)+'</strong><small>'+esc(map.name)+' · '+hops+' portal'+(hops===1?'':'s')+' away</small><button type="button" class="cursor-interaction" data-inspect="'+map.id+'">Open location</button></div></div>').join('');
      if(state.category==='quests')items.innerHTML=questRows(relevantQuests(m));
      if(state.category==='connections'){
        items.innerHTML='<div class="mc-eyebrow">Direct exits</div>'+m.portals.map(e=>'<div class="mc-row"><div><strong>'+esc(get(e.to)?.name||e.to)+'</strong><small>'+esc(e.name)+' → '+esc(e.arrival||'destination')+'</small></div><button type="button" class="cursor-interaction" data-inspect="'+e.to+'">Open</button></div>').join('');
        if(members.length>1)items.innerHTML+='<button type="button" id="mc-expand" class="cursor-interaction mc-expand">'+(state.expanded?'Hide':'Expand')+' '+members.length+' maps in this location</button><div id="mc-memberlist" '+(state.expanded?'':'hidden')+'>'+members.map(p=>'<div class="mc-row"><div><strong>'+esc(p.name)+'</strong><small>'+p.npcs.length+' NPCs · '+p.monsters.length+' monster types</small></div><button type="button" class="cursor-interaction" data-inspect="'+p.id+'">Open</button></div>').join('')+'</div>';
        items.innerHTML+='<div class="mc-datahint">Shop interiors are linked here. Shop inventory and prices need separate verification.</div>';
        if($('#mc-expand'))$('#mc-expand').onclick=()=>{state.expanded=!state.expanded;detail();};
      }
      items.innerHTML+='<a class="mc-source" href="https://osmsdataexplorer.com/?tab=maps&id='+String(m.id).padStart(9,'0')+'" target="_blank" rel="noopener">Map '+m.id+' · Source data ↗</a>';
      $('#mc-go').onclick=()=>{state.to=String(m.id);$('#mc-to').value=m.name;state.panel='route';setSheet(true);plan();render();save();};
      $('#mc-start').onclick=()=>setStart(m);
      $$('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;detail();save();});
    }
    $$('[data-inspect]').forEach(b=>b.onclick=()=>inspect(b.dataset.inspect));
    $$('[data-quest]').forEach(s=>s.onchange=()=>{state.status[s.dataset.quest]=s.value;$('#mc-status').textContent='Progress updated · Change the status anytime to undo.';detail();markers();save();});icons();
  }
  function inspect(id){if(!get(id))return;state.selected=String(id);state.panel='place';setSheet(true);state.expanded=false;detail();markers();save();}
  function setStart(m){state.from=String(m.id);$('#mc-from').value=m.name;$('#mc-status').textContent='Starting at '+m.name+' · Set manually';state.pick=false;$('#mc-pickstart').textContent='Pick start on map';plan();render();save();}
  function markers(){
    const routeSpots=new Set(state.route.map(id=>get(id)?.spot));const selectedSpot=get(state.selected)?.spot;
    $('#mc-markers').innerHTML=DATA.spots.map(s=>{
      const m=get(s.primary),routeIndex=state.route.findIndex(id=>get(id)?.spot===s.id),isFrom=get(state.from)?.spot===s.id,isTo=get(state.to)?.spot===s.id;
      const relevant=state.layer==='quests'?new Set(s.members.map(get).filter(Boolean).flatMap(relevantQuests).filter(q=>q.level<=state.level&&state.status[q.id]!=='completed').map(q=>q.id)).size:state.layer==='shops'?m.portals.map(e=>get(e.to)).filter(x=>x&&/shop|store|market/i.test(x.name)).length:0;
      const selected=s.id===selectedSpot,isRoute=routeSpots.has(s.id),town=s.kind==='town';
      return '<button type="button" class="mc-place cursor-interaction" data-spot="'+s.id+'" data-selected="'+selected+'" data-route="'+isRoute+'" data-town="'+town+'" data-schematic="'+Boolean(s.schematic)+'" data-endpoint="'+(isFrom||isTo)+'" aria-label="Inspect '+esc(s.label)+(s.schematic?' · Schematic position':'')+'" data-tooltip="'+esc(s.label)+(s.schematic?' · Schematic position':'')+'"><span class="mc-dot">'+(isFrom?'A':isTo?'B':isRoute?routeIndex:'')+'</span><span class="mc-tag">'+(s.schematic?'◇ ':'')+esc(s.label)+'</span>'+(state.layer!=='all'&&relevant?'<span class="mc-badge">'+relevant+'</span>':'')+'</button>';
    }).join('');
    $$('[data-spot]').forEach(b=>{b.onclick=()=>{const s=spots.get(b.dataset.spot);if(state.pick)setStart(get(s.primary));else inspect(s.primary);};b.ondblclick=()=>{const s=spots.get(b.dataset.spot);state.focus=s.id;state.zoom=Math.min(2.5,state.zoom*1.35);state.category='connections';state.expanded=true;detail();camera();};});camera();
  }
  let width=1024,height=670,scale=1,ox=0,oy=0;
  function placeLabels(points,narrow,left){
    const minX=narrow?8:left+8,maxX=width-8,minY=narrow?260:70,maxY=narrow?height-80:height-84;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),placed=[];
    const mapRect=$('#mc-map').getBoundingClientRect();
    const blocked=$$('.mc-maptools,.mc-zooms,.mc-mapfooter,.mc-mapcaption,.mc-routeform,.mc-tabs,.mc-detail').filter(e=>e.offsetWidth&&e.offsetHeight).map(e=>{const r=e.getBoundingClientRect();return{x:r.left-mapRect.left,y:r.top-mapRect.top,w:r.width,h:r.height};});
    const intersects=(a,b,p=4)=>a.x<b.x+b.w+p&&a.x+a.w>b.x-p&&a.y<b.y+b.h+p&&a.y+a.h>b.y-p;
    const route=$('#mc-route'),samples=[],total=route.getAttribute('d')?.trim()?route.getTotalLength():0;
    if(total>0)for(let d=0;d<=total;d+=10/scale){const p=route.getPointAtLength(d);samples.push({x:ox+p.x*scale,y:oy+p.y*scale,w:0,h:0});}
    const labels=points.filter(p=>p.b.dataset.selected==='true'||p.b.dataset.town==='true').sort((a,b)=>Number(b.b.dataset.selected==='true')-Number(a.b.dataset.selected==='true'));
    points.forEach(p=>p.b.classList.remove('mc-showlabel'));
    labels.forEach(p=>{
      const tag=p.b.querySelector('.mc-tag'),selected=p.b.dataset.selected==='true';
      tag.style.maxWidth=Math.min(240,maxX-minX)+'px';p.b.classList.add('mc-showlabel');
      const w=tag.offsetWidth,h=tag.offsetHeight,candidates=[];
      const add=(x,y)=>{const r={x:clamp(x,minX,maxX-w),y:clamp(y,minY,maxY-h),w,h};
        r.collisions=points.filter(q=>intersects(r,{x:q.x-q.r,y:q.y-q.r,w:q.r*2,h:q.r*2},4)).length+placed.filter(q=>intersects(r,q,5)).length+blocked.filter(q=>intersects(r,q,3)).length;
        r.score=r.collisions*100000+samples.filter(q=>intersects(r,q,5)).length*100+Math.hypot(r.x+w/2-p.x,r.y+h/2-p.y);candidates.push(r);};
      [24,40,60,84].forEach(gap=>{add(p.x-w/2,p.y+gap);add(p.x-w/2,p.y-gap-h);add(p.x+gap,p.y-h/2);add(p.x-gap-w,p.y-h/2);});
      if(selected&&!candidates.some(r=>!r.collisions))for(let y=minY;y<=maxY-h;y+=20)for(let x=minX;x<=maxX-w;x+=24)add(x,y);
      candidates.sort((a,b)=>a.score-b.score);const best=candidates[0];
      if(!best||(!selected&&best.collisions)){p.b.classList.remove('mc-showlabel');return;}
      tag.style.left=best.x-p.x+22+'px';tag.style.top=best.y-p.y+22+'px';placed.push(best);
    });
  }
  function routePath(){let d='',last=null;for(const id of state.route){const a=anchor(id);if(!a){last=null;continue;}if(last&&a.id===anchor(last)?.id){last=id;continue;}if(last){let segment=DATA.artRoutes?.[last+':'+id];if(!segment){const reverse=DATA.artRoutes?.[id+':'+last];if(reverse){const p=reverse.match(/-?\d+(?:\.\d+)?/g).map(Number);segment='M'+p[6]+' '+p[7]+'C'+p[4]+' '+p[5]+' '+p[2]+' '+p[3]+' '+p[0]+' '+p[1];}}d+=segment?' '+segment.slice(segment.indexOf('C')):' M'+a.x+' '+a.y;}else d+=' M'+a.x+' '+a.y;last=id;}return d;}
  function camera(){
    const el=$('#mc-map');width=el.clientWidth;height=el.clientHeight;const narrow=width<700,left=narrow?0:320,availableW=width-left;
    let mapTop=70,mapBottom=height-84;
    if(narrow){const bounds=el.getBoundingClientRect(),form=$('#mc-form').getBoundingClientRect();$('.mc-maptools').style.top=(form.bottom-bounds.top+12)+'px';mapTop=$('.mc-maptools').getBoundingClientRect().bottom-bounds.top+16;$('.mc-zooms').style.top=mapTop+'px';mapBottom=Math.max(mapTop+80,root.classList.contains('mc-sheet-open')?$('.mc-tabs').getBoundingClientRect().top-bounds.top-16:height-84);}
    else{$('.mc-maptools').style.top='';$('.mc-zooms').style.top='';}
    const routePoints=state.route.map(anchor).filter(Boolean),a=spots.get(state.focus);
    if(a){scale=(narrow?width/600:Math.min(availableW/700,height/600))*state.zoom;ox=left+availableW/2-a.x*scale+state.dx;oy=(narrow?(mapTop+mapBottom)/2:height/2)-a.y*scale+state.dy;}
    else if(state.fitAll||!routePoints.length){scale=Math.min((availableW-25)/1458,(narrow?mapBottom-mapTop:height-90)/1079)*state.zoom;ox=left+(availableW-1458*scale)/2+state.dx;oy=(narrow?mapTop+(mapBottom-mapTop-1079*scale)/2:(height-1079*scale)/2)+state.dy;}
    else if(narrow){const xs=routePoints.map(p=>p.x),ys=routePoints.map(p=>p.y),top=mapTop,bottom=mapBottom,cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;scale=Math.min((width-64)/(Math.max(...xs)-Math.min(...xs)+40),(bottom-top-20)/(Math.max(...ys)-Math.min(...ys)+40))*state.zoom;ox=width/2-cx*scale+state.dx;oy=(top+bottom)/2-cy*scale+state.dy;}
    else{const xs=routePoints.map(p=>p.x),ys=routePoints.map(p=>p.y),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;scale=Math.min((availableW-110)/(Math.max(...xs)-Math.min(...xs)+400),(height-170)/(Math.max(...ys)-Math.min(...ys)+380))*state.zoom;scale=Math.min(scale,1.7*state.zoom);ox=left+availableW/2-cx*scale+state.dx;oy=height*.54-cy*scale+state.dy;}
    $('#mc-svg').setAttribute('viewBox','0 0 '+width+' '+height);$('#mc-world').setAttribute('transform','translate('+ox+','+oy+') scale('+scale+')');
    $$('[data-ocean]').forEach(r=>{r.setAttribute('x',-ox/scale-2);r.setAttribute('y',-oy/scale-2);r.setAttribute('width',width/scale+4);r.setAttribute('height',height/scale+4);});
    const selectedSpot=get(state.selected)?.spot;
    const labelPoints=[];
    $$('[data-spot]').forEach(b=>{const s=spots.get(b.dataset.spot),x=ox+s.x*scale,y=oy+s.y*scale;b.style.left=x+'px';b.style.top=y+'px';const hidden=x<20||x>width-20||y<55||y>height-60;b.style.display=hidden?'none':'';if(!hidden)labelPoints.push({b,x,y,r:b.dataset.route==='true'?13:9});});
    const d=routePath();$('#mc-route').setAttribute('d',d);$('#mc-routehalo').setAttribute('d',d);const c=anchor(state.route[state.step]);$('#mc-traveler').setAttribute('visibility',c&&state.step?'visible':'hidden');if(c){$('#mc-traveler').setAttribute('cx',c.x);$('#mc-traveler').setAttribute('cy',c.y);}
    placeLabels(labelPoints,narrow,left);
    $('#mc-network').setAttribute('d',Object.values(DATA.artRoutes||{}).join(' '));$('#mc-zoom').textContent=Math.round(state.zoom*100)+'%';const unplaced=state.route.filter(id=>!anchor(id)).length;$('#mc-caption').textContent=state.route.length?(state.route.length-1)+' portal transitions · '+(unplaced?unplaced+' stops have no reviewed atlas position':'Select any numbered stop'):'Explore the recorded map network';
  }
  function render(){detail();markers();['all','for-you','shops'].forEach((id,i)=>$('#mc-'+id).setAttribute('aria-pressed',String(state.layer===['all','quests','shops'][i])));}
  function syncFields(){ $('#mc-level').value=state.level;$('#mc-from').value=get(state.from).name;$('#mc-to').value=get(state.to).name; }
  syncFields();
  $('#mc-towns').innerHTML=DATA.maps.map(m=>'<option value="'+esc(m.name)+'"></option>').join('');
  $('#mc-form').onsubmit=e=>{e.preventDefault();const a=find($('#mc-from').value),b=find($('#mc-to').value);if(!a||!b){$('#mc-status').textContent='Select a map name from the suggestions.';return;}state.from=String(a.id);state.to=String(b.id);state.panel='route';setSheet(true);plan();render();$('#mc-status').textContent=state.route.length?'Route follows recorded portal connections · No live game tracking':'No recorded portal route. Try another start.';save();};
  $('#mc-from').onchange=()=>$('#mc-form').requestSubmit();$('#mc-to').onchange=()=>$('#mc-form').requestSubmit();
  $('#mc-pickstart').onclick=()=>{state.pick=!state.pick;$('#mc-pickstart').textContent=state.pick?'Select a point…':'Pick start on map';$('#mc-status').textContent=state.pick?'Click any map point to set your current location.':'Location set manually';};
  $$('.mc-tabs button').forEach(b=>b.onclick=()=>{state.panel=b.dataset.panel;setSheet(true);detail();camera();save();});
  $('#mc-level').onchange=e=>{state.level=Math.max(1,Math.min(100,Number(e.target.value)||1));e.target.value=state.level;render();save();};
  ['all','for-you','shops'].forEach((id,i)=>$('#mc-'+id).onclick=()=>{state.layer=['all','quests','shops'][i];state.category=i===2?'connections':i===1?'quests':'monsters';state.panel='place';render();save();});
  $('#mc-plus').onclick=()=>{state.zoom=Math.min(3,state.zoom*1.2);camera();};$('#mc-minus').onclick=()=>{state.zoom=Math.max(.5,state.zoom/1.2);camera();};$('#mc-fit').onclick=()=>{state.zoom=1;state.dx=0;state.dy=0;state.fitAll=true;state.focus=null;camera();};
  let drag=null;$('#mc-map').onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,dx:state.dx,dy:state.dy};$('#mc-map').setPointerCapture(e.pointerId);};$('#mc-map').onpointermove=e=>{if(!drag)return;state.dx=drag.dx+e.clientX-drag.x;state.dy=drag.dy+e.clientY-drag.y;camera();};$('#mc-map').onpointerup=()=>{drag=null;};$('#mc-map').onpointercancel=()=>{drag=null;};
  $('#mc-map').addEventListener('wheel',e=>{if(e.target.closest('button'))return;e.preventDefault();state.zoom=Math.max(.5,Math.min(3,state.zoom*(e.deltaY<0?1.1:1/1.1)));camera();},{passive:false});
  $('#mc-network').style.visibility='hidden';plan();render();new ResizeObserver(camera).observe($('#mc-map'));
  if(document.fonts?.ready)document.fonts.ready.then(camera);
  window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState)){syncFields();plan();render();}});
  if(globalThis.Tweak){const options={network:false};const tweak=new Tweak({container:root,onChange:()=>$('#mc-network').style.visibility=options.network?'visible':'hidden'});tweak.addToggle(options,'network',{label:'Show recorded connections'});}
})();

});
