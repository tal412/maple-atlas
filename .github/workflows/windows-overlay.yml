# Checks the Windows app's on-game navigation card on a real Windows machine: a stand-in
# game window, a route step and a position; the card must show at the window's top centre.
name: Windows overlay check
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/link/overlay_windows.go'
      - 'macos/link/overlay_demo_windows.go'
      - 'macos/link/nav.go'
      - '.github/workflows/windows-overlay.yml'
permissions:
  contents: read
jobs:
  overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: macos/link/go.mod
      - name: Build the app (window files replaced by a stub)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force macos/link/webui | Out-Null
          Set-Content macos/link/webui/index.html '<!doctype html><title>stub</title>'
          cd macos/link
          go test ./...
          go build -tags desktopui -o "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe" .
      - name: Overlay self-check
        shell: pwsh
        run: |
          cd $env:RUNNER_TEMP
          $out = & "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe" --overlay-demo | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { throw "overlay self-check failed ($code)" }
          Write-Host 'PASS: navigation card shown at the game window top centre'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-demo
          path: ${{ runner.temp }}/overlay-demo.bmp
          if-no-files-found: warn
