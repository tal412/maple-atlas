# Checks the Windows app's firewall handling on a real Windows machine: the check
# the window runs at launch, the repair (--repair-firewall), and the setup program.
name: Windows firewall check
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/link/firewall_windows.go'
      - 'macos/link/diagnostics.go'
      - 'macos/link/desktop.go'
      - 'macos/link/session.go'
      - 'windows/installer.nsi'
      - '.github/workflows/windows-firewall.yml'
permissions:
  contents: read
jobs:
  firewall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: macos/link/go.mod
      - name: Build the app (window files replaced by a stub)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force macos/link/webui | Out-Null
          Set-Content macos/link/webui/index.html '<!doctype html><title>stub</title>'
          cd macos/link
          go build -tags desktopui -o "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe" .
      - name: Firewall scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe"
          Set-NetFirewallProfile -All -Enabled True
          Get-NetConnectionProfile | Format-Table Name, NetworkCategory
          function Check { (& $exe --check-firewall | Out-String).Trim() | ConvertFrom-Json }
          function Mine { @(Get-NetFirewallApplicationFilter | Where-Object { [Environment]::ExpandEnvironmentVariables("$($_.Program)") -ieq $exe } | Get-NetFirewallRule | Where-Object Direction -eq 'Inbound') }
          function Expect($what, $state) { $r = Check; Write-Host "$what -> $($r.state) $($r.detail)"; if ($r.state -ne $state) { throw "${what}: expected $state, got $($r.state)" } }
          Expect 'fresh install, no rules' 'missing'
          # What Windows saves when its first-run prompt is cancelled.
          New-NetFirewallRule -DisplayName 'mapleatlascompanion.exe' -Direction Inbound -Program $exe -Action Block -Protocol UDP -Profile Any | Out-Null
          Expect 'cancelled prompt (block rule)' 'blocked'
          & $exe --repair-firewall; if ($LASTEXITCODE -ne 0) { throw "repair exit $LASTEXITCODE" }
          $rules = Mine; $rules | Format-Table DisplayName, Action, Profile, Enabled
          if (@($rules | Where-Object Action -eq 'Block').Count) { throw 'block rule survived the repair' }
          if (@($rules | Where-Object Action -eq 'Allow').Count -ne 2) { throw 'expected two allow rules' }
          Expect 'after repair' 'ok'
          # Allowed only on Private while the network is Public (the default "Allow" click).
          $rules | Remove-NetFirewallRule
          Get-NetConnectionProfile | ForEach-Object { try { Set-NetConnectionProfile -InterfaceIndex $_.InterfaceIndex -NetworkCategory Public } catch { Write-Host "cannot set category: $_" } }
          New-NetFirewallRule -DisplayName 'mapleatlascompanion.exe' -Direction Inbound -Program $exe -Action Allow -Protocol UDP -Profile Private | Out-Null
          $cats = (Get-NetConnectionProfile).NetworkCategory -join ','; Write-Host "network: $cats"
          if ($cats -match 'Public') { Expect 'allowed on Private only, network Public' 'missing' }
          # A path stored with %ProgramFiles%-style variables and other letter case.
          (Mine) | Remove-NetFirewallRule
          & $exe --repair-firewall
          Expect 'repair again' 'ok'
          & $exe --remove-firewall; if ($LASTEXITCODE -ne 0) { throw "remove exit $LASTEXITCODE" }
          if ((Mine).Count) { throw 'rules left after --remove-firewall' }
          Expect 'after remove' 'missing'
          Write-Host 'PASS: firewall check, repair and removal'
      - name: Allow button through the app (as the window does it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe"
          $state = "$env:RUNNER_TEMP\state"; New-Item -ItemType Directory -Force $state | Out-Null
          & $exe --remove-firewall
          New-NetFirewallRule -DisplayName 'mapleatlascompanion.exe' -Direction Inbound -Program $exe -Action Block -Protocol UDP -Profile Any | Out-Null
          $env:MAPLE_LINK_NO_WINDOW = '1'
          $p = Start-Process $exe -ArgumentList '-ui','-state-dir',$state -RedirectStandardOutput "$env:RUNNER_TEMP\app.out" -RedirectStandardError "$env:RUNNER_TEMP\app.err" -PassThru
          $url = $null
          for ($i = 0; $i -lt 60 -and -not $url; $i++) { Start-Sleep -Milliseconds 500; $m = Select-String -Path "$env:RUNNER_TEMP\app.out" -Pattern 'page: (http://[^/]+)/\?t=(\w+)' -ErrorAction SilentlyContinue; if ($m) { $url = $m.Matches[0].Groups[1].Value; $token = $m.Matches[0].Groups[2].Value } }
          if (-not $url) { Get-Content "$env:RUNNER_TEMP\app.err"; throw 'the app did not start its page' }
          $h = @{ 'X-Companion-Token' = $token; 'Origin' = $url }
          $before = Invoke-RestMethod "$url/api/firewall" -Headers $h
          Write-Host "before: $($before.state) $($before.detail) | $($before.rules -join ' ; ')"
          if ($before.state -ne 'blocked') { throw "expected blocked before, got $($before.state)" }
          $r = Invoke-RestMethod "$url/api/firewall" -Method Post -Headers $h -TimeoutSec 90
          Write-Host "after: $($r.state) | repair: $($r.repair | ConvertTo-Json -Compress) | $($r.rules -join ' ; ')"
          if (-not $r.repair.approved -or -not $r.repair.finished -or $r.repair.error) { throw 'the repair did not report success' }
          if ($r.state -ne 'ok') { throw "expected ok after the button, got $($r.state)" }
          $diag = Invoke-WebRequest "$url/api/diagnostics" -Headers $h -UseBasicParsing
          $text = $diag.Content
          Write-Host ($text.Substring(0, [Math]::Min(2500, $text.Length)))
          $code = (Select-String -Path "$env:RUNNER_TEMP\app.out","$env:RUNNER_TEMP\app.err" -Pattern '"code":"([A-Z0-9]{20,})"' -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($code -and $text.Contains($code.Matches[0].Groups[1].Value)) { throw 'the pairing code leaked into diagnostics' }
          if (-not $text.Contains('Firewall:') -or -not $text.Contains('"state": "ok"')) { throw 'diagnostics are missing the firewall state' }
          if (-not $text.Contains('Network: code offers')) { throw 'diagnostics are missing the network adapters' }
          ($text -split "`n" | Select-String 'Network: code offers' | Select-Object -First 1).Line
          Stop-Process $p -Force
          & $exe --remove-firewall
          Write-Host 'PASS: the Allow button repairs the firewall, reports it, and diagnostics hide the pairing code'
      - name: Setup program (silent install and uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force windows/build/installer | Out-Null
          Copy-Item "$env:RUNNER_TEMP\app\MapleAtlasCompanion.exe" windows/build/
          Get-ChildItem windows/build -Recurse | Format-Table FullName, Length
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List
          Start-Sleep 5; Get-ChildItem windows/build | Format-Table Name, Length
          python -c "from PIL import Image" 2>$null; if ($LASTEXITCODE -ne 0) { python -m pip install --quiet pillow }
          python -c "from PIL import Image; Image.new('RGBA',(256,256),(37,100,222,255)).save('windows/build/installer/icon.ico', sizes=[(256,256),(48,48),(32,32),(16,16)])"
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location windows; & $nsis -V2 '-DVERSION=0.0.1' installer.nsi; if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }; Pop-Location
          Start-Process windows/build/MapleAtlasCompanion-Setup.exe -ArgumentList '/S' -Wait
          $installed = "$env:ProgramFiles\Maple Atlas Companion\MapleAtlasCompanion.exe"
          if (-not (Test-Path $installed)) { throw 'not installed' }
          $rules = @(Get-NetFirewallApplicationFilter | Where-Object { [Environment]::ExpandEnvironmentVariables("$($_.Program)") -ieq $installed } | Get-NetFirewallRule)
          $rules | Format-Table DisplayName, Action, Profile, Direction
          if (@($rules | Where-Object { $_.Action -eq 'Allow' -and $_.Direction -eq 'Inbound' }).Count -ne 2) { throw 'setup did not add the two allow rules' }
          $r = (& $installed --check-firewall | Out-String).Trim() | ConvertFrom-Json; Write-Host "installed app check -> $($r.state)"
          if ($r.state -ne 'ok') { throw "installed app reports $($r.state)" }
          Get-Process MapleAtlasCompanion -ErrorAction SilentlyContinue | Stop-Process -Force
          # _?= runs the uninstaller in place, so -Wait covers the whole uninstall.
          Start-Process "$env:ProgramFiles\Maple Atlas Companion\Uninstall.exe" -ArgumentList '/S', "_?=$env:ProgramFiles\Maple Atlas Companion" -Wait
          $left = @(Get-NetFirewallApplicationFilter | Where-Object { [Environment]::ExpandEnvironmentVariables("$($_.Program)") -ieq $installed } | Get-NetFirewallRule)
          if ($left.Count) {
            Write-Host 'Files left:'; Get-ChildItem "$env:ProgramFiles\Maple Atlas Companion" -ErrorAction SilentlyContinue | Format-Table Name
            $left | Format-Table DisplayName, Action, Direction
            if (Test-Path $installed) { $p = Start-Process $installed -ArgumentList '--remove-firewall' -Wait -PassThru; Write-Host "manual --remove-firewall exit: $($p.ExitCode)" }
            throw 'uninstall left firewall rules'
          }
          Write-Host 'PASS: setup adds the firewall rules, uninstall removes them'
